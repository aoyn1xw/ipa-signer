<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign IPA Files Online</title>

  <meta name="description" content="Fast, clean, and stable iOS IPA signer. Sign and install IPA files over the air easily.">
  <meta name="keywords" content="iOS, IPA, signer, sign, OTA, distribution, iPhone, iPad">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yourdomain.com/">
  <meta property="og:title" content="IPA Signer">
  <meta property="og:description" content="Fast, clean, and stable iOS IPA signer. Sign and install IPA files over the air easily.">

  <meta property="twitter:card" content="summary">
  <meta property="twitter:url" content="https://yourdomain.com/">
  <meta property="twitter:title" content="IPA Signer">
  <meta property="twitter:description" content="Fast, clean, and stable iOS IPA signer. Sign and install IPA files over the air easily.">

  <meta name="theme-color" content="#007aff">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Theme Toggle Button -->
  <button class="toggle" id="themeToggle" aria-label="Toggle dark mode">
    <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <!-- Icon will be set dynamically via JS -->
    </svg>
  </button>

  <main class="page">
    <div class="container">
      <header class="header">
        <div class="header-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h1>Sign and install iOS apps over the air</h1>
      </header>

      <div class="card">
        <form id="signForm">
          <!-- IPA File Upload -->
          <div class="field">
            <span class="field-label">IPA File</span>
            <label class="file-upload-card" id="ipa-card">
              <div class="file-upload-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="17 8 12 3 7 8"/>
                  <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
              </div>
              <div class="file-upload-info">
                <span class="file-upload-title" id="ipa-title">Choose IPA file</span>
                <span class="file-upload-desc" id="ipa-desc">Drag & drop or click to browse</span>
              </div>
              <input type="file" name="ipa" id="ipa" accept=".ipa">
            </label>
          </div>

          <!-- Certificate File Upload -->
          <div class="field">
            <span class="field-label">Certificate (.p12)</span>
            <label class="file-upload-card" id="p12-card">
              <div class="file-upload-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </div>
              <div class="file-upload-info">
                <span class="file-upload-title" id="p12-title">Choose Certificate (.p12)</span>
                <span class="file-upload-desc" id="p12-desc">Drag & drop or click to browse</span>
              </div>
              <input type="file" name="p12" id="p12" accept=".p12" required>
            </label>
          </div>

          <!-- Provisioning Profile File Upload -->
          <div class="field">
            <span class="field-label">Provisioning Profile</span>
            <label class="file-upload-card" id="mobileprovision-card">
              <div class="file-upload-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                  <line x1="16" y1="13" x2="8" y2="13"/>
                  <line x1="16" y1="17" x2="8" y2="17"/>
                  <polyline points="10 9 9 9 8 9"/>
                </svg>
              </div>
              <div class="file-upload-info">
                <span class="file-upload-title" id="mobileprovision-title">Choose Provisioning Profile</span>
                <span class="file-upload-desc" id="mobileprovision-desc">Drag & drop or click to browse</span>
              </div>
              <input type="file" name="mobileprovision" id="mobileprovision" accept=".mobileprovision" required>
            </label>
          </div>

          <!-- Password Field -->
          <div class="field">
            <span class="field-label">P12 Password</span>
            <div class="input-text-wrapper">
              <input type="password" name="p12_password" id="p12_password" placeholder="Optional">
            </div>
          </div>

          <hr class="divider">

          <!-- Advanced Toggle -->
          <button type="button" class="advanced-toggle" id="advancedToggle" aria-expanded="false" aria-controls="advancedContent">
            Advanced options
            <span class="chevron">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </span>
          </button>

          <!-- Advanced Wrapper -->
          <div class="advanced-wrapper" id="advancedContent" aria-hidden="true">
            <div class="advanced-inner">
              <div class="advanced-container">
                <div class="field">
                  <span class="field-label">App Name</span>
                  <input type="text" name="adv_name" id="adv_name" placeholder="Optional">
                </div>

                <div class="field">
                  <span class="field-label">App Version</span>
                  <input type="text" name="adv_version" id="adv_version" placeholder="Optional">
                </div>

                <div class="field">
                  <span class="field-label">Bundle ID</span>
                  <input type="text" name="adv_bundle_id" id="adv_bundle_id" placeholder="com.example.app">
                </div>

                <div class="field">
                  <span class="field-label">Minimum iOS</span>
                  <input type="text" name="adv_min_os" id="adv_min_os" placeholder="e.g. 12.0">
                </div>

                <div class="checkbox-list">
                  <label class="checkbox-item">
                    <input type="checkbox" name="adv_remove_supported_devices" id="adv_remove_supported_devices">
                    Remove UISupportedDevices
                  </label>
                  <label class="checkbox-item">
                    <input type="checkbox" name="adv_no_watch" id="adv_no_watch">
                    Remove Watch App
                  </label>
                  <label class="checkbox-item">
                    <input type="checkbox" name="adv_fakesign" id="adv_fakesign">
                    Fakesign Binaries
                  </label>
                  <label class="checkbox-item">
                    <input type="checkbox" name="adv_thin" id="adv_thin">
                    Thin to arm64
                  </label>
                  <label class="checkbox-item">
                    <input type="checkbox" name="adv_remove_extensions" id="adv_remove_extensions">
                    Remove All Extensions
                  </label>
                  <label class="checkbox-item">
                    <input type="checkbox" name="adv_remove_encrypted" id="adv_remove_encrypted">
                    Remove Encrypted Extensions
                  </label>
                </div>
              </div>
            </div>
          </div>

          <button type="submit" class="btn">Sign IPA</button>
        </form>
      </div>
    </div>
  </main>

  <!-- Status Modal Dialog -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal" id="modalCard">
      <div class="modal-icon" id="modalIcon"></div>
      <h2 id="modalTitle"></h2>
      <p id="modalMessage"></p>
      <a id="modalLink" class="btn-link" href="#" target="_blank" rel="noopener noreferrer" hidden>Open Install Page</a>
      <button type="button" class="btn-secondary" id="modalClose">Close</button>
    </div>
  </div>

  <script>
    // Theme toggle Logic
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const body = document.body;
    const currentTheme = localStorage.getItem('theme') || 'light';
    
    body.setAttribute('data-theme', currentTheme);
    updateThemeIcon(currentTheme);

    themeToggle.addEventListener('click', function() {
      const newTheme = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      body.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeIcon(newTheme);
    });

    function updateThemeIcon(theme) {
      if (theme === 'dark') {
        themeIcon.innerHTML = `
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        `;
      } else {
        themeIcon.innerHTML = `
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        `;
      }
    }

    // File Inputs visual updates
    function setupFileCard(inputId, cardId, titleId, descId, defaultTitle) {
      const input = document.getElementById(inputId);
      const card = document.getElementById(cardId);
      const title = document.getElementById(titleId);
      const desc = document.getElementById(descId);

      input.addEventListener('change', function() {
        if (input.files && input.files.length > 0) {
          const file = input.files[0];
          card.classList.add('has-file');
          title.textContent = file.name;
          
          let sizeStr = '';
          if (file.size > 1024 * 1024) {
            sizeStr = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
          } else {
            sizeStr = (file.size / 1024).toFixed(2) + ' KB';
          }
          desc.textContent = 'File loaded successfully • ' + sizeStr;
        } else {
          card.classList.remove('has-file');
          title.textContent = defaultTitle;
          desc.textContent = 'Drag & drop or click to browse';
        }
      });
    }

    setupFileCard('ipa', 'ipa-card', 'ipa-title', 'ipa-desc', 'Choose IPA file');
    setupFileCard('p12', 'p12-card', 'p12-title', 'p12-desc', 'Choose Certificate (.p12)');
    setupFileCard('mobileprovision', 'mobileprovision-card', 'mobileprovision-title', 'mobileprovision-desc', 'Choose Provisioning Profile');

    // Advanced toggle accordion
    const advancedToggle = document.getElementById('advancedToggle');
    const advancedContent = document.getElementById('advancedContent');

    advancedToggle.addEventListener('click', function() {
      const isExpanded = this.getAttribute('aria-expanded') === 'true';
      this.setAttribute('aria-expanded', String(!isExpanded));
      advancedContent.classList.toggle('expanded', !isExpanded);
      advancedContent.setAttribute('aria-hidden', String(isExpanded));
    });

    // Form sign handling and modal presentation
    const form = document.getElementById('signForm');
    const overlay = document.getElementById('overlay');
    const modalCard = document.getElementById('modalCard');
    const modalIcon = document.getElementById('modalIcon');
    const modalTitle = document.getElementById('modalTitle');
    const modalMessage = document.getElementById('modalMessage');
    const modalLink = document.getElementById('modalLink');
    const modalClose = document.getElementById('modalClose');
    const submitBtn = form.querySelector('button[type="submit"]');

    function showModal(title, message, link, isError) {
      modalTitle.textContent = title;
      modalMessage.textContent = message;
      
      modalCard.className = 'modal ' + (isError ? 'error' : 'success');
      if (isError) {
        modalIcon.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        `;
      } else {
        modalIcon.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        `;
      }

      modalLink.hidden = !link;
      if (link) modalLink.href = link;
      overlay.classList.add('show');
    }

    function closeModal() {
      overlay.classList.remove('show');
    }

    modalClose.addEventListener('click', closeModal);
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) closeModal();
    });

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const ipaFile = document.getElementById('ipa').files[0];
      const p12File = document.getElementById('p12').files[0];
      const mpFile = document.getElementById('mobileprovision').files[0];

      if (!ipaFile || !p12File || !mpFile) {
        showModal('Missing files', 'Please select IPA, P12, and Provisioning Profile files.', null, true);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing...';

      fetch('/sign', { method: 'POST', body: new FormData(form) })
        .then(function(response) {
          if (!response.ok) {
            return response.text().then(function(text) {
              try {
                const json = JSON.parse(text);
                throw new Error(json.error || 'Server error');
              } catch (err) {
                if (err instanceof SyntaxError) {
                  throw new Error('Server error: ' + response.status);
                }
                throw err;
              }
            });
          }
          return response.json();
        })
        .then(function(data) {
          if (data.installLink) {
            showModal('Signing complete', 'Your signed IPA is ready to install.', data.installLink, false);
          } else {
            throw new Error(data.error || 'Unknown error');
          }
        })
        .catch(function(error) {
          showModal('Error', error.message, null, true);
        })
        .finally(function() {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign IPA';
        });
    });
  </script>
</body>
</html>
