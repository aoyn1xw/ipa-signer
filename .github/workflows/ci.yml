name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check app.js && node --check zsign-worker.js

      - name: Smoke test server
        run: |
          node app.js > server.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
              exit 0
            fi
            sleep 0.5
          done

          cat server.log
          exit 1
